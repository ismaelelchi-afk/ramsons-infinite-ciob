<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAMSONS INFINITE</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #080607;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- CONFIGURATION & PALETTE ---
        const PALETTE = {
            corporateRed: 0x960018,
            luminousRed: 0xE60026,
            darkRed: 0x35000B,
            deepBlack: 0x080607,
            white: 0xFFFFFF,
            silver: 0xC0C0C0,
            gold: 0xD4AF37
        };

        class RamsonsInfinite {
            constructor() {
                this.initScene();
                this.initPostProcessing();
                this.createLogoTexture();
                this.initObjects();
                this.setupEvents();
                this.startExperience();
                this.animate();
            }

            initScene() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(PALETTE.deepBlack);
                this.scene.fog = new THREE.FogExp2(PALETTE.deepBlack, 0.05);

                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.camera.position.set(0, 0, 5);

                this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.toneMapping = THREE.ReinhardToneMapping;
                this.renderer.toneMappingExposure = 1.5;
                document.body.appendChild(this.renderer.domElement);

                const ambientLight = new THREE.AmbientLight(PALETTE.darkRed, 0.5);
                this.scene.add(ambientLight);

                this.pointLight = new THREE.PointLight(PALETTE.luminousRed, 10, 50);
                this.pointLight.position.set(5, 5, 5);
                this.scene.add(this.pointLight);

                this.mainLight = new THREE.DirectionalLight(PALETTE.white, 1);
                this.mainLight.position.set(0, 10, 0);
                this.scene.add(this.mainLight);
            }

            initPostProcessing() {
                this.composer = new EffectComposer(this.renderer);
                this.composer.addPass(new RenderPass(this.scene, this.camera));

                const bloomPass = new UnrealBloomPass(
                    new THREE.Vector2(window.innerWidth, window.innerHeight),
                    1.5, // strength
                    0.4, // radius
                    0.85 // threshold
                );
                this.composer.addPass(bloomPass);
            }

            createLogoTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 1024;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = 'bold 120px Arial, Helvetica, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('RAMSONS', canvas.width / 2, canvas.height / 2);

                this.logoTexture = new THREE.CanvasTexture(canvas);
                this.logoTexture.anisotropy = this.renderer.capabilities.getMaxAnisotropy();
            }

            initObjects() {
                this.objects = {};

                // 1. Logo Mesh
                const logoGeo = new THREE.BoxGeometry(4, 1, 0.1);
                const logoMat = new THREE.MeshStandardMaterial({
                    map: this.logoTexture,
                    emissive: PALETTE.white,
                    emissiveIntensity: 1,
                    metalness: 0.8,
                    roughness: 0.2,
                    transparent: true
                });
                this.logo = new THREE.Mesh(logoGeo, logoMat);
                this.logo.visible = false;
                this.scene.add(this.logo);

                // 2. Liquid-like Floor
                this.liquidFloor = this.createLiquidFloor();
                this.scene.add(this.liquidFloor);

                // 3. Particle System
                this.particles = this.createParticleSystem();
                this.scene.add(this.particles);

                // 4. Abstract Sculptures
                this.sculptureGroup = new THREE.Group();
                this.createSculptures();
                this.scene.add(this.sculptureGroup);
            }

            createLiquidFloor() {
                const geo = new THREE.PlaneGeometry(100, 100, 128, 128);
                const mat = new THREE.MeshStandardMaterial({
                    color: PALETTE.corporateRed,
                    metalness: 0.9,
                    roughness: 0.1,
                    flatShading: false,
                });

                const mesh = new THREE.Mesh(geo, mat);
                mesh.rotation.x = -Math.PI / 2;
                mesh.position.y = -2;
                return mesh;
            }

            createParticleSystem() {
                const count = 8000;
                const geo = new THREE.BufferGeometry();
                const pos = new Float32Array(count * 3);
                const colors = new Float32Array(count * 3);

                for (let i = 0; i < count * 3; i++) {
                    pos[i] = (Math.random() - 0.5) * 30;
                    colors[i] = Math.random();
                }

                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                const mat = new THREE.PointsMaterial({
                    size: 0.04,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.6,
                    blending: THREE.AdditiveBlending
                });

                return new THREE.Points(geo, mat);
            }

            createSculptures() {
                for (let i = 0; i < 20; i++) {
                    const size = Math.random() * 2 + 0.5;
                    const geo = new THREE.IcosahedronGeometry(size, 0);
                    const mat = new THREE.MeshStandardMaterial({
                        color: i % 2 === 0 ? PALETTE.corporateRed : PALETTE.darkRed,
                        metalness: 1,
                        roughness: 0.2,
                    });
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.position.set(
                        (Math.random() - 0.5) * 25,
                        (Math.random() - 0.5) * 25,
                        (Math.random() - 0.5) * 25
                    );
                    mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
                    this.sculptureGroup.add(mesh);
                }
            }

            setupEvents() {
                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                    this.composer.setSize(window.innerWidth, window.innerHeight);
                });
            }

            startExperience() {
                this.state = 'CORE'; 
                this.stateTimer = 0;
                this.stateDuration = 12;
                this.cameraTarget = new THREE.Vector3(0, 0, 0);
                this.cameraPos = new THREE.Vector3(0, 0, 5);
            }

            updateState() {
                this.stateTimer += 0.016;
                if (this.stateTimer > this.stateDuration) {
                    this.stateTimer = 0;
                    const states = ['CORE', 'LIQUID', 'PARTICLES', 'GEOMETRIC'];
                    this.state = states[Math.floor(Math.random() * states.length)];
                    this.stateDuration = 12 + Math.random() * 8;
                }

                switch (this.state) {
                    case 'CORE':
                        this.logo.visible = true;
                        this.logo.position.lerp(new THREE.Vector3(0, 0, 0), 0.05);
                        this.logo.rotation.y = Math.sin(Date.now() * 0.001) * 0.1;
                        this.cameraPos.lerp(new THREE.Vector3(0, 0, 6), 0.02);
                        this.sculptureGroup.visible = false;
                        this.particles.visible = true;
                        break;
                    case 'LIQUID':
                        this.logo.visible = false;
                        this.cameraPos.lerp(new THREE.Vector3(0, 2, 10), 0.02);
                        this.sculptureGroup.visible = false;
                        this.particles.visible = false;
                        break;
                    case 'PARTICLES':
                        this.logo.visible = false;
                        this.cameraPos.lerp(new THREE.Vector3(0, 8, 3), 0.02);
                        this.sculptureGroup.visible = false;
                        this.particles.visible = true;
                        break;
                    case 'GEOMETRIC':
                        this.logo.visible = true;
                        this.logo.position.lerp(new THREE.Vector3(0, 2, 0), 0.05);
                        this.cameraPos.lerp(new THREE.Vector3(-8, 4, 8), 0.02);
                        this.sculptureGroup.visible = true;
                        this.particles.visible = true;
                        break;
                }
                this.camera.position.lerp(this.cameraPos, 0.05);
                this.camera.lookAt(this.cameraTarget);
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                const time = Date.now() * 0.001;

                const positions = this.liquidFloor.geometry.attributes.position;
                for (let i = 0; i < positions.count; i++) {
                    const x = positions.getX(i);
                    const y = positions.getY(i);
                    const wave = Math.sin(x * 0.3 + time) * 0.3 + Math.cos(y * 0.3 + time) * 0.3;
                    positions.setZ(i, wave);
                }
                positions.needsUpdate = true;

                this.particles.rotation.y += 0.001;
                this.particles.rotation.x += 0.0005;

                this.sculptureGroup.children.forEach((s, i) => {
                    s.rotation.x += 0.005;
                    s.rotation.y += 0.005;
                    s.position.y += Math.sin(time + i) * 0.002;
                });

                this.pointLight.position.x = Math.sin(time * 0.5) * 7;
                this.pointLight.position.z = Math.cos(time * 0.5) * 7;

                this.updateState();
                this.composer.render();
            }
        }

        new RamsonsInfinite();
    </script>
</body>
</html>
