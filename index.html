<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#080607">
    <title>RAMSONS INFINITE</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #080607;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body { cursor: none; }
        body.active { cursor: default; }
        canvas { display: block; width: 100%; height: 100%; }

        #fs {
            position: fixed;
            right: max(18px, env(safe-area-inset-right));
            bottom: max(18px, env(safe-area-inset-bottom));
            width: 46px;
            height: 46px;
            padding: 0;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.22);
            background: rgba(255, 255, 255, 0.07);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transform: translateY(6px);
            transition: opacity .5s, transform .5s, background .25s, border-color .25s;
        }
        body.active #fs { opacity: 1; pointer-events: auto; transform: none; }
        #fs:hover { background: rgba(230, 0, 38, 0.35); border-color: rgba(255, 255, 255, 0.5); }
        #fs svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        #fs .ico-exit { display: none; }
        body.is-fs #fs .ico-enter { display: none; }
        body.is-fs #fs .ico-exit { display: block; }
    </style>
</head>
<body>
    <button id="fs" type="button" aria-label="Pantalla completa" title="Pantalla completa (F)">
        <svg class="ico-enter" viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M3 16v5h5"/></svg>
        <svg class="ico-exit" viewBox="0 0 24 24"><path d="M8 3v5H3M16 3v5h5M21 16h-5v5M3 16h5v5"/></svg>
    </button>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // --- LOGO REAL (opcional) ---
        // Para usar el logo oficial: PNG con fondo transparente, en data URI (base64)
        // o como archivo servido por http (ej. 'logo.png'). Se convierte a blanco automáticamente.
        // Vacío = se usa el texto "RAMSONS" en Arial Bold (como la versión anterior).
        const LOGO_SRC = '';

        // --- PALETA ---
        const PALETTE = {
            corporateRed: 0x960018,
            luminousRed: 0xE60026,
            darkRed: 0x35000B,
            deepBlack: 0x080607,
            white: 0xFFFFFF,
            silver: 0xC0C0C0
        };

        // --- LÍNEA DE TIEMPO: CORE -> DISSOLVE -> ENERGY -> REFORM -> CORE ... ---
        const PHASE = { CORE: 0, DISSOLVE: 1, ENERGY: 2, REFORM: 3 };
        const DURATIONS = [14, 5, 12, 6]; // segundos

        const TAU = Math.PI * 2;
        const clamp01 = (v) => Math.min(1, Math.max(0, v));
        const smooth = (v) => { v = clamp01(v); return v * v * (3 - 2 * v); };

        const AMBIENT_COUNT = 5000;
        const LOGO_PARTICLE_COUNT = 7000;
        const SPARK_COUNT = 360;
        const RING_COUNT = 4;

        // Posición de cada partícula en las tres formas de la fase de energía
        function formation(style, s1, s2, s3, t, dir, o) {
            if (style === 0) {
                // Vórtice en espiral
                const r = 0.9 + s1 * 6.8;
                const a = s2 * TAU + dir * t * (1.3 / (0.6 + r * 0.25));
                o[0] = Math.cos(a) * r;
                o[2] = Math.sin(a) * r;
                o[1] = -0.9 + s3 * 3.4 + Math.sin(t * 0.8 + s2 * 6.0) * 0.3;
            } else if (style === 1) {
                // Esfera de energía que respira
                const th = s2 * TAU + dir * t * 0.35;
                const phi = Math.acos(2 * s3 - 1);
                const R = 2.5 + s1 * 0.9 + Math.sin(t * 0.9 + s1 * 10.0) * 0.22;
                o[0] = R * Math.sin(phi) * Math.cos(th);
                o[1] = 0.6 + R * Math.cos(phi) * 0.7;
                o[2] = R * Math.sin(phi) * Math.sin(th);
            } else {
                // Hélice de tres brazos
                const h = -1.8 + s3 * 5.6;
                const rad = 0.8 + 1.5 * (0.5 + 0.5 * Math.sin(h * 0.9 - t * 1.5)) + s1 * 0.6;
                const arm = Math.floor(s2 * 3);
                const a = arm * (TAU / 3) + (s2 * 3 - arm) * 0.6 + dir * t * 1.8 + h * 0.8;
                o[0] = Math.cos(a) * rad;
                o[2] = Math.sin(a) * rad;
                o[1] = h;
            }
        }

        // Acabado: viñeta + grano fino (evita bandas en degradados oscuros en TV)
        const FinishShader = {
            uniforms: { tDiffuse: { value: null }, uTime: { value: 0 } },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }`,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float uTime;
                varying vec2 vUv;
                float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
                void main() {
                    vec4 c = texture2D(tDiffuse, vUv);
                    float d = length(vUv - 0.5);
                    float v = 1.0 - smoothstep(0.25, 0.9, d);
                    c.rgb *= mix(0.5, 1.0, v);
                    c.rgb += (hash(vUv * 1000.0 + uTime) - 0.5) * 0.012;
                    gl_FragColor = c;
                }`
        };

        class RamsonsInfinite {
            constructor() {
                this.initScene();
                this.initBackground();
                this.initPostProcessing();
                this.createLogoTexture();
                this.initObjects();
                this.initInteraction();
                this.setupEvents();
                this.startExperience();
                this.onResize();
                if (LOGO_SRC) this.loadLogoImage(LOGO_SRC);
                this.animate = this.animate.bind(this);
                requestAnimationFrame(this.animate);
            }

            // ---------------------------------------------------------------- ESCENA
            initScene() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(PALETTE.deepBlack);
                this.scene.fog = new THREE.FogExp2(PALETTE.deepBlack, 0.028);

                this.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 400);
                this.camera.position.set(0, 0, 5);

                this.renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.renderer.toneMappingExposure = 1.05;
                document.body.insertBefore(this.renderer.domElement, document.body.firstChild);

                // Instalación de larga duración: si el contexto WebGL se pierde, recargar.
                this.renderer.domElement.addEventListener('webglcontextlost', (e) => e.preventDefault());
                this.renderer.domElement.addEventListener('webglcontextrestored', () => location.reload());

                // Iluminación de estudio (sin luces rojas flotantes)
                this.scene.add(new THREE.AmbientLight(0x2a2024, 0.7));

                this.keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
                this.keyLight.position.set(3, 4, 6);
                this.scene.add(this.keyLight);

                this.rimLight = new THREE.DirectionalLight(0xcfe0ff, 3.0);
                this.rimLight.position.set(-5, 2, -3);
                this.scene.add(this.rimLight);

                this.rimLight2 = new THREE.DirectionalLight(0xffffff, 1.6);
                this.rimLight2.position.set(5, -1, -4);
                this.scene.add(this.rimLight2);
            }

            initBackground() {
                // Esfera de fondo: negro con un resplandor rojo oscuro muy tenue detrás del logo
                const mat = new THREE.ShaderMaterial({
                    side: THREE.BackSide,
                    depthWrite: false,
                    fog: false,
                    uniforms: { uPulse: { value: 0 } },
                    vertexShader: `
                        varying vec3 vDir;
                        void main() {
                            vDir = position;
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                        }`,
                    fragmentShader: `
                        varying vec3 vDir;
                        uniform float uPulse;
                        void main() {
                            vec3 d = normalize(vDir);
                            float g = pow(max(-d.z, 0.0), 5.0);
                            float h = smoothstep(-0.6, 0.9, d.y);
                            vec3 base = mix(vec3(0.020, 0.015, 0.017), vec3(0.045, 0.030, 0.035), h * 0.6);
                            vec3 red = vec3(0.28, 0.0, 0.05);
                            gl_FragColor = vec4(base + red * g * (0.5 + 0.4 * uPulse), 1.0);
                        }`
                });
                this.bg = new THREE.Mesh(new THREE.SphereGeometry(120, 32, 16), mat);
                this.bg.renderOrder = -10;
                this.scene.add(this.bg);
            }

            initPostProcessing() {
                const size = new THREE.Vector2();
                this.renderer.getDrawingBufferSize(size);
                const target = new THREE.WebGLRenderTarget(size.x, size.y, {
                    type: THREE.HalfFloatType,
                    samples: 4
                });
                this.composer = new EffectComposer(this.renderer, target);
                this.composer.addPass(new RenderPass(this.scene, this.camera));

                this.bloomPass = new UnrealBloomPass(
                    new THREE.Vector2(window.innerWidth, window.innerHeight),
                    0.55, // fuerza
                    0.7,  // radio
                    0.88  // umbral: solo brillan los destellos, no el blanco base
                );
                this.composer.addPass(this.bloomPass);

                this.finishPass = new ShaderPass(FinishShader);
                this.composer.addPass(this.finishPass);
                this.composer.addPass(new OutputPass());
            }

            // ---------------------------------------------------------------- LOGO
            createLogoTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 1024;
                canvas.height = 256;
                this.logoCanvas = canvas;
                this.drawLogoText();
                this.logoTexture = new THREE.CanvasTexture(canvas);
                this.logoTexture.colorSpace = THREE.SRGBColorSpace;
                this.logoTexture.anisotropy = this.renderer.capabilities.getMaxAnisotropy();
            }

            drawLogoText() {
                const canvas = this.logoCanvas;
                const ctx = canvas.getContext('2d');
                ctx.globalCompositeOperation = 'source-over';
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = 'bold 150px Arial, Helvetica, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('RAMSONS', canvas.width / 2, canvas.height / 2 + 4);
            }

            loadLogoImage(src) {
                const img = new Image();
                img.onload = () => {
                    try {
                        const canvas = this.logoCanvas;
                        const ctx = canvas.getContext('2d');
                        ctx.globalCompositeOperation = 'source-over';
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        const maxW = canvas.width * 0.8, maxH = canvas.height * 0.7;
                        const s = Math.min(maxW / img.width, maxH / img.height);
                        const w = img.width * s, h = img.height * s;
                        ctx.drawImage(img, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
                        // Todo píxel visible pasa a blanco
                        ctx.globalCompositeOperation = 'source-in';
                        ctx.fillStyle = 'white';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.globalCompositeOperation = 'source-over';
                        ctx.getImageData(0, 0, 1, 1); // falla si el canvas quedó "tainted"
                        this.logoTexture.needsUpdate = true;
                        this.resampleLogo();
                    } catch (err) {
                        console.warn('No se pudo usar el logo externo, se mantiene el texto.', err);
                        this.drawLogoText();
                        this.logoTexture.needsUpdate = true;
                        this.resampleLogo();
                    }
                };
                img.onerror = () => console.warn('No se pudo cargar LOGO_SRC.');
                img.src = src;
            }

            createDotTexture() {
                const c = document.createElement('canvas');
                c.width = c.height = 64;
                const ctx = c.getContext('2d');
                const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
                g.addColorStop(0, 'rgba(255,255,255,1)');
                g.addColorStop(0.35, 'rgba(255,255,255,0.6)');
                g.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = g;
                ctx.fillRect(0, 0, 64, 64);
                return new THREE.CanvasTexture(c);
            }

            initObjects() {
                this.dotTexture = this.createDotTexture();

                // 1. Logo: letras blancas con volumen (placa frontal con brillo + capas de profundidad)
                this.logoGroup = new THREE.Group();
                this.scene.add(this.logoGroup);

                const W = 4, H = 1, depth = 0.09, layers = 9;
                const geo = new THREE.PlaneGeometry(W, H);
                this.slabMats = [];
                const front = new THREE.Color(0xc4c4cc);
                const back = new THREE.Color(0x4a4a52);
                const c = new THREE.Color();
                for (let i = 0; i < layers; i++) {
                    const f = (i + 1) / layers;
                    c.copy(front).lerp(back, f);
                    const m = new THREE.MeshStandardMaterial({
                        map: this.logoTexture,
                        color: c.clone(),
                        metalness: 0.65,
                        roughness: 0.32,
                        alphaTest: 0.5
                    });
                    this.slabMats.push(m);
                    const mesh = new THREE.Mesh(geo, m);
                    mesh.position.z = -depth * f;
                    this.logoGroup.add(mesh);
                }

                this.logoU = {
                    map: { value: this.logoTexture },
                    uOpacity: { value: 1 },
                    uSweep: { value: -1 },
                    uPtr: { value: new THREE.Vector2(-9, -9) },
                    uPtrAmt: { value: 0 },
                    uFlash: { value: 0 }
                };
                this.logoFrontMat = new THREE.ShaderMaterial({
                    transparent: true,
                    depthWrite: false,
                    uniforms: this.logoU,
                    vertexShader: `
                        varying vec2 vUv;
                        void main() {
                            vUv = uv;
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                        }`,
                    fragmentShader: `
                        uniform sampler2D map;
                        uniform float uOpacity, uSweep, uPtrAmt, uFlash;
                        uniform vec2 uPtr;
                        varying vec2 vUv;
                        void main() {
                            float a = texture2D(map, vUv).a;
                            if (a < 0.01) discard;
                            vec3 col = vec3(0.90, 0.90, 0.92) * (0.92 + 0.08 * vUv.y);
                            // barrido de luz diagonal
                            float x = vUv.x + (vUv.y - 0.5) * 0.35;
                            float band = exp(-pow((x - uSweep) * 7.0, 2.0));
                            col += band * vec3(1.0, 0.82, 0.84) * 1.1;
                            // linterna del puntero
                            vec2 p = vec2(vUv.x * 4.0, vUv.y);
                            float d = distance(p, uPtr);
                            col += exp(-d * d * 1.6) * uPtrAmt * vec3(1.0, 0.88, 0.88) * 0.9;
                            col += uFlash * vec3(1.0, 0.9, 0.9);
                            gl_FragColor = vec4(col, a * uOpacity);
                        }`
                });
                const frontMesh = new THREE.Mesh(geo, this.logoFrontMat);
                frontMesh.position.z = 0.002;
                frontMesh.renderOrder = 2;
                this.logoGroup.add(frontMesh);

                // 2. Polvo ambiental fino
                this.particles = this.createParticleSystem();
                this.scene.add(this.particles);

                // 3. Partículas que forman el logo
                this.createLogoParticles();
                this.scene.add(this.logoParticles);
            }

            createParticleSystem() {
                const count = AMBIENT_COUNT;
                const geo = new THREE.BufferGeometry();
                const pos = new Float32Array(count * 3);
                const colors = new Float32Array(count * 3);
                const col = new THREE.Color();
                for (let i = 0; i < count; i++) {
                    // distribución esférica con más densidad cerca del centro
                    const r = 2.5 + Math.pow(Math.random(), 0.7) * 18;
                    const th = Math.random() * TAU;
                    const ph = Math.acos(2 * Math.random() - 1);
                    pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
                    pos[i * 3 + 1] = r * Math.cos(ph) * 0.8;
                    pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);

                    const roll = Math.random();
                    if (roll < 0.68) col.setRGB(0.75, 0.75, 0.78);
                    else if (roll < 0.9) col.setRGB(0.5, 0.5, 0.55);
                    else col.set(PALETTE.luminousRed).multiplyScalar(0.8);
                    col.multiplyScalar(0.45 + Math.random() * 0.55);
                    colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
                }
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                const mat = new THREE.PointsMaterial({
                    size: 0.05,
                    map: this.dotTexture,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.55,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });
                const pts = new THREE.Points(geo, mat);
                pts.frustumCulled = false;
                return pts;
            }

            createLogoParticles() {
                const count = LOGO_PARTICLE_COUNT;
                this.home = new Float32Array(count * 3);
                this.seed = new Float32Array(count * 3);
                this.jitter = new Float32Array(count * 3);
                this.xn = new Float32Array(count);
                const positions = new Float32Array(count * 3);
                const colors = new Float32Array(count * 3);

                const red = new THREE.Color(PALETTE.luminousRed);
                const white = new THREE.Color(PALETTE.white);
                const c = new THREE.Color();
                for (let i = 0; i < count; i++) {
                    const j = i * 3;
                    this.seed[j] = Math.random();
                    this.seed[j + 1] = Math.random();
                    this.seed[j + 2] = Math.random();
                    this.jitter[j] = (Math.random() - 0.5) * 3;
                    this.jitter[j + 1] = (Math.random() - 0.5) * 3;
                    this.jitter[j + 2] = (Math.random() - 0.5) * 3;
                    // mitad blancas/plateadas, mitad rojo de marca
                    const mix = Math.random() < 0.5 ? 0.75 + Math.random() * 0.25 : Math.random() * 0.3;
                    c.copy(red).lerp(white, mix);
                    colors[j] = c.r; colors[j + 1] = c.g; colors[j + 2] = c.b;
                }

                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                const mat = new THREE.PointsMaterial({
                    size: 0.03,
                    map: this.dotTexture,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    sizeAttenuation: true
                });

                this.logoParticles = new THREE.Points(geo, mat);
                this.logoParticles.frustumCulled = false;
                this.logoParticles.visible = false;
                this.activeLogoCount = count;
                this.resampleLogo();
            }

            // Muestrea los píxeles del logo para que las partículas formen su silueta exacta
            resampleLogo() {
                const w = this.logoCanvas.width;
                const h = this.logoCanvas.height;
                const data = this.logoCanvas.getContext('2d').getImageData(0, 0, w, h).data;
                const pixels = [];
                for (let y = 0; y < h; y += 2) {
                    for (let x = 0; x < w; x += 2) {
                        if (data[(y * w + x) * 4 + 3] > 128) pixels.push(x, y);
                    }
                }
                const total = pixels.length / 2;
                if (!total) return;

                const count = LOGO_PARTICLE_COUNT;
                const pos = this.logoParticles.geometry.attributes.position.array;
                let minX = Infinity, maxX = -Infinity;
                for (let i = 0; i < count; i++) {
                    const k = Math.floor(Math.random() * total) * 2;
                    const px = pixels[k] + (Math.random() - 0.5) * 2;
                    const py = pixels[k + 1] + (Math.random() - 0.5) * 2;
                    const j = i * 3;
                    const hx = (px / w - 0.5) * 4;
                    const hy = (0.5 - py / h) * 1;
                    const hz = 0.06 + (Math.random() - 0.5) * 0.1;
                    this.home[j] = hx; this.home[j + 1] = hy; this.home[j + 2] = hz;
                    pos[j] = hx; pos[j + 1] = hy; pos[j + 2] = hz;
                    if (hx < minX) minX = hx;
                    if (hx > maxX) maxX = hx;
                }
                const span = Math.max(0.001, maxX - minX);
                for (let i = 0; i < count; i++) this.xn[i] = (this.home[i * 3] - minX) / span;
                this.logoParticles.geometry.attributes.position.needsUpdate = true;
            }

            // ---------------------------------------------------------------- INTERACCIÓN
            initInteraction() {
                this.ptrN = new THREE.Vector2(0, 0);       // puntero en coordenadas normalizadas
                this.ptrS = new THREE.Vector2(0, 0);       // versión suavizada (parallax)
                this.ptrWorld = new THREE.Vector3(0, 0, 0); // puntero proyectado al plano del logo
                this.ptrPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
                this.raycaster = new THREE.Raycaster();
                this.lastInteract = -100;
                this.lastSpark = new THREE.Vector2(9, 9);
                this.hold = false;
                this.ptrAmt = 0;
                this.attractS = 0;
                this.hideTimer = null;

                // Chispas
                const n = SPARK_COUNT;
                this.sp = new Float32Array(n * 3);
                this.sv = new Float32Array(n * 3);
                this.sl = new Float32Array(n);
                this.sm = new Float32Array(n);
                this.sc = new Float32Array(n * 3);
                this.sw = new Uint8Array(n);
                this.sparkHead = 0;
                const g = new THREE.BufferGeometry();
                g.setAttribute('position', new THREE.BufferAttribute(this.sp, 3));
                g.setAttribute('color', new THREE.BufferAttribute(this.sc, 3));
                this.sparks = new THREE.Points(g, new THREE.PointsMaterial({
                    size: 0.07,
                    map: this.dotTexture,
                    vertexColors: true,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                }));
                this.sparks.frustumCulled = false;
                this.scene.add(this.sparks);

                // Anillos de onda
                const ringGeo = new THREE.RingGeometry(0.97, 1, 96);
                this.rings = [];
                for (let i = 0; i < RING_COUNT; i++) {
                    const mat = new THREE.MeshBasicMaterial({
                        color: 0xffffff,
                        transparent: true,
                        opacity: 0,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false,
                        side: THREE.DoubleSide
                    });
                    const mesh = new THREE.Mesh(ringGeo, mat);
                    mesh.visible = false;
                    this.scene.add(mesh);
                    this.rings.push({ mesh, age: 0, life: 1, max: 1, inten: 1, on: false });
                }
                this.ringHead = 0;
            }

            updatePointerWorld() {
                this.raycaster.setFromCamera(this.ptrN, this.camera);
                this.raycaster.ray.intersectPlane(this.ptrPlane, this.ptrWorld);
            }

            wake() {
                document.body.classList.add('active');
                clearTimeout(this.hideTimer);
                this.hideTimer = setTimeout(() => document.body.classList.remove('active'), 3000);
            }

            emitSpark(x, y, z, vx, vy, vz, life, warm) {
                const i = this.sparkHead;
                this.sparkHead = (i + 1) % SPARK_COUNT;
                const j = i * 3;
                this.sp[j] = x; this.sp[j + 1] = y; this.sp[j + 2] = z;
                this.sv[j] = vx; this.sv[j + 1] = vy; this.sv[j + 2] = vz;
                this.sl[i] = life;
                this.sm[i] = life;
                this.sw[i] = warm ? 1 : 0;
            }

            burst(x, y, z, n) {
                for (let i = 0; i < n; i++) {
                    const a = Math.random() * TAU;
                    const sp = 0.8 + Math.random() * 3.2;
                    this.emitSpark(x, y, z,
                        Math.cos(a) * sp, Math.sin(a) * sp, (Math.random() - 0.5) * 1.5,
                        0.8 + Math.random() * 1.2, Math.random() < 0.4);
                }
            }

            spawnRing(x, y, z, maxR, life, inten) {
                const r = this.rings[this.ringHead];
                this.ringHead = (this.ringHead + 1) % RING_COUNT;
                r.age = 0; r.life = life; r.max = maxR; r.inten = inten; r.on = true;
                r.mesh.position.set(x, y, z);
                r.mesh.visible = true;
            }

            updateSparks(dt) {
                const n = SPARK_COUNT;
                const drag = Math.exp(-dt * 1.6);
                for (let i = 0; i < n; i++) {
                    const j = i * 3;
                    if (this.sl[i] > 0) {
                        this.sl[i] -= dt;
                        this.sv[j] *= drag; this.sv[j + 1] *= drag; this.sv[j + 2] *= drag;
                        this.sv[j + 1] += dt * 0.25;
                        this.sp[j] += this.sv[j] * dt;
                        this.sp[j + 1] += this.sv[j + 1] * dt;
                        this.sp[j + 2] += this.sv[j + 2] * dt;
                        const k = clamp01(this.sl[i] / this.sm[i]);
                        const inten = k * k;
                        if (this.sw[i]) {
                            this.sc[j] = 1.0 * inten; this.sc[j + 1] = (0.1 + 0.5 * k) * inten; this.sc[j + 2] = (0.12 + 0.5 * k) * inten;
                        } else {
                            this.sc[j] = 0.95 * inten; this.sc[j + 1] = 0.92 * inten; this.sc[j + 2] = 0.95 * inten;
                        }
                    } else if (this.sc[j] !== 0 || this.sc[j + 1] !== 0 || this.sc[j + 2] !== 0) {
                        this.sc[j] = 0; this.sc[j + 1] = 0; this.sc[j + 2] = 0;
                    }
                }
                this.sparks.geometry.attributes.position.needsUpdate = true;
                this.sparks.geometry.attributes.color.needsUpdate = true;
            }

            updateRings(dt) {
                for (let i = 0; i < RING_COUNT; i++) {
                    const r = this.rings[i];
                    if (!r.on) continue;
                    r.age += dt;
                    const k = r.age / r.life;
                    if (k >= 1) { r.on = false; r.mesh.visible = false; continue; }
                    const s = Math.max(0.01, r.max * (1 - Math.pow(1 - k, 3)));
                    r.mesh.scale.set(s, s, 1);
                    r.mesh.material.opacity = Math.pow(1 - k, 2) * r.inten;
                }
            }

            onPointerMove(e) {
                this.ptrN.set((e.clientX / window.innerWidth) * 2 - 1, -((e.clientY / window.innerHeight) * 2 - 1));
                this.lastInteract = this.time;
                this.updatePointerWorld();
                this.wake();
                // estela de chispas
                const dx = this.ptrN.x - this.lastSpark.x, dy = this.ptrN.y - this.lastSpark.y;
                if (dx * dx + dy * dy > 0.0006) {
                    this.lastSpark.copy(this.ptrN);
                    const p = this.ptrWorld;
                    for (let i = 0; i < 2; i++) {
                        this.emitSpark(p.x, p.y, 0.15,
                            (Math.random() - 0.5) * 0.8, (Math.random() - 0.5) * 0.8, (Math.random() - 0.5) * 0.5,
                            0.5 + Math.random() * 0.6, Math.random() < 0.35);
                    }
                }
            }

            onPointerDown(e) {
                if (e.target && e.target.closest && e.target.closest('#fs')) return;
                this.onPointerMove(e);
                this.hold = true;
                this.trigger();
            }

            onPointerUp() { this.hold = false; }

            // Toque / clic / Enter / Espacio
            trigger() {
                const p = this.ptrWorld;
                this.burst(p.x, p.y, 0.15, 70);
                this.spawnRing(p.x, p.y, 0.1, 2.6, 1.2, 0.5);
                this.lastInteract = this.time;

                if (this.phase === PHASE.CORE && this.phaseT > 1.5) {
                    this.flash = Math.max(this.flash, 0.4);
                    this.enterPhase(PHASE.DISSOLVE);       // romper el logo
                } else if (this.phase === PHASE.ENERGY && this.phaseT > 1.5 && this.styleBlend >= 1) {
                    this.prevStyle = this.style;           // transformar la forma de energía
                    this.style = (this.style + 1) % 3;
                    this.styleBlend = 0;
                }
            }

            toggleFullscreen() {
                const d = document, el = d.documentElement;
                const isFs = d.fullscreenElement || d.webkitFullscreenElement;
                try {
                    if (!isFs) {
                        const req = el.requestFullscreen || el.webkitRequestFullscreen;
                        if (req) { const r = req.call(el); if (r && r.catch) r.catch(() => {}); }
                    } else {
                        const ex = d.exitFullscreen || d.webkitExitFullscreen;
                        if (ex) { const r = ex.call(d); if (r && r.catch) r.catch(() => {}); }
                    }
                } catch (err) { /* sin soporte */ }
            }

            async requestWake() {
                try {
                    if ('wakeLock' in navigator) this.wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) { /* opcional */ }
            }

            setupEvents() {
                window.addEventListener('resize', () => this.onResize());
                window.addEventListener('pointermove', (e) => this.onPointerMove(e));
                window.addEventListener('pointerdown', (e) => this.onPointerDown(e));
                window.addEventListener('pointerup', () => this.onPointerUp());
                window.addEventListener('pointercancel', () => this.onPointerUp());

                const btn = document.getElementById('fs');
                const el = document.documentElement;
                if (!(el.requestFullscreen || el.webkitRequestFullscreen)) btn.style.display = 'none';
                btn.addEventListener('click', (e) => { e.stopPropagation(); this.toggleFullscreen(); });
                const onFs = () => document.body.classList.toggle('is-fs', !!(document.fullscreenElement || document.webkitFullscreenElement));
                document.addEventListener('fullscreenchange', onFs);
                document.addEventListener('webkitfullscreenchange', onFs);

                window.addEventListener('keydown', (e) => {
                    if (e.repeat) return;
                    if (e.key === 'f' || e.key === 'F') this.toggleFullscreen();
                    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.wake(); this.ptrWorld.set(0, 0, 0); this.trigger(); }
                });

                // Pantalla siempre encendida (instalación continua)
                this.requestWake();
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'visible') this.requestWake();
                });
            }

            onResize() {
                const w = window.innerWidth, h = window.innerHeight;
                const aspect = w / h;
                this.camera.aspect = aspect;
                // Distancia que mantiene al logo protagonista en cualquier pantalla
                const frac = Math.min(0.85, Math.max(0.52, 0.52 + (1.4 - aspect) * 0.4));
                const tanHalf = Math.tan(THREE.MathUtils.degToRad(this.camera.fov / 2));
                this.baseZ = (4 / frac) / (2 * tanHalf * aspect);
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(w, h);
                this.composer.setSize(w, h);
            }

            // ---------------------------------------------------------------- CICLO
            startExperience() {
                this.phase = PHASE.CORE;
                this.phaseT = 0;
                this.cycle = 0;
                this.style = 0;
                this.prevStyle = 0;
                this.styleBlend = 1;
                this.dir = 1;
                this.time = 0;
                this.energy = 0;
                this.flash = 0;
                this.shockFired = true;
                this.sweepT = 0.5;
                this.progress = 0;
                this.baseZ = 5;
                this.camPos = new THREE.Vector3(0, 0, 5);
                this.lookY = 0;
                this.last = performance.now();
                this.O = new Float32Array(3);
                this.P = new Float32Array(3);

                // Calidad adaptable
                const dpr = window.devicePixelRatio || 1;
                this.qualityLevels = [
                    { pr: Math.min(dpr, 2),   n: 1.0 },
                    { pr: Math.min(dpr, 1.5), n: 0.75 },
                    { pr: 1,                  n: 0.55 },
                    { pr: 0.75,               n: 0.4 }
                ];
                this.quality = 0;
                this.perfAcc = 0;
                this.perfFrames = 0;
            }

            enterPhase(p) {
                this.phase = p;
                this.phaseT = 0;
                if (p === PHASE.DISSOLVE) {
                    this.style = this.cycle % 3;
                    this.prevStyle = this.style;
                    this.styleBlend = 1;
                    this.dir = this.cycle % 2 === 0 ? 1 : -1;
                } else if (p === PHASE.REFORM) {
                    this.shockFired = false;
                } else if (p === PHASE.CORE) {
                    this.cycle++;
                    this.sweepT = this.time + 1.5;
                }
            }

            applyQuality() {
                const q = this.qualityLevels[this.quality];
                this.renderer.setPixelRatio(q.pr);
                this.composer.setPixelRatio(q.pr);
                this.composer.setSize(window.innerWidth, window.innerHeight);
                this.activeLogoCount = Math.floor(LOGO_PARTICLE_COUNT * q.n);
                this.particles.geometry.setDrawRange(0, Math.floor(AMBIENT_COUNT * q.n));
            }

            monitorPerformance(dt) {
                if (this.time < 6) { this.perfAcc = 0; this.perfFrames = 0; return; }
                this.perfAcc += dt;
                this.perfFrames++;
                if (this.perfAcc >= 3) {
                    const avg = this.perfAcc / this.perfFrames;
                    this.perfAcc = 0;
                    this.perfFrames = 0;
                    if (avg > 0.03 && this.quality < this.qualityLevels.length - 1) {
                        this.quality++;
                        this.applyQuality();
                    }
                }
            }

            updateTimeline(dt) {
                this.phaseT += dt;
                if (this.phaseT >= DURATIONS[this.phase]) {
                    const carry = this.phaseT - DURATIONS[this.phase];
                    this.enterPhase((this.phase + 1) % 4);
                    this.phaseT = carry;
                }
                if (this.styleBlend < 1) this.styleBlend = Math.min(1, this.styleBlend + dt / 1.4);

                const t = this.phaseT;
                const p = t / DURATIONS[this.phase];
                let logoA = 1, partA = 0, energy = 0, prog = 0;

                switch (this.phase) {
                    case PHASE.CORE:
                        if (this.time - this.sweepT > 7) this.sweepT = this.time; // barrido de luz periódico
                        break;
                    case PHASE.DISSOLVE: {
                        const f = smooth(t / 0.8);
                        logoA = 1 - f;
                        partA = f;
                        energy = 0.5 * smooth(p);
                        prog = clamp01((t - 0.4) / 4.6);
                        break;
                    }
                    case PHASE.ENERGY: {
                        logoA = 0;
                        partA = 1;
                        let e = 0.5 + 0.5 * smooth(t / 3);
                        e *= 1 - 0.6 * smooth((t - 9) / 3);
                        energy = e;
                        prog = 1;
                        break;
                    }
                    case PHASE.REFORM: {
                        partA = 1 - smooth((t - 5) / 1);
                        logoA = smooth((t - 4.8) / 1.2);
                        energy = 0.4 * (1 - smooth(t / 4.5));
                        prog = clamp01(t / 4.8);
                        if (!this.shockFired && t >= 4.6) {
                            this.shockFired = true;
                            this.flash = 1;
                            this.sweepT = this.time + 0.3;
                            this.spawnRing(0, 0, 0.05, 11, 2.8, 0.8);
                        }
                        break;
                    }
                }

                this.energy = energy;
                this.progress = prog;
                this.flash *= Math.exp(-dt * 1.8);

                // Logo sólido
                const op = logoA;
                this.logoU.uOpacity.value = op;
                this.logoU.uFlash.value = this.flash * 0.6;
                const sw = this.time - this.sweepT;
                this.logoU.uSweep.value = sw < 0 ? -1 : -0.6 + sw * 1.1;
                for (let i = 0; i < this.slabMats.length; i++) {
                    const m = this.slabMats[i];
                    m.opacity = op;
                    m.transparent = op < 0.999;
                    m.emissive.setScalar(this.flash * 0.18);
                }
                this.logoGroup.visible = op > 0.003;

                // Linterna del puntero sobre el logo
                const active = (this.time - this.lastInteract) < 2.5;
                this.ptrAmt += ((active ? 1 : 0) - this.ptrAmt) * (1 - Math.exp(-dt * 4));
                this.logoU.uPtrAmt.value = this.ptrAmt * op;
                this.logoU.uPtr.value.set(this.ptrWorld.x + 2, this.ptrWorld.y + 0.5);

                // Movimiento del logo: flotación + inclinación hacia el puntero
                const tt = this.time;
                this.ptrS.x += ((active ? this.ptrN.x : 0) - this.ptrS.x) * (1 - Math.exp(-dt * 3));
                this.ptrS.y += ((active ? this.ptrN.y : 0) - this.ptrS.y) * (1 - Math.exp(-dt * 3));
                const ry = Math.sin(tt * 0.5) * 0.1 + this.ptrS.x * 0.2;
                const rx = Math.sin(tt * 0.37) * 0.02 - this.ptrS.y * 0.1;
                const py = Math.sin(tt * 0.7) * 0.025;
                this.logoGroup.rotation.set(rx, ry, 0);
                this.logoGroup.position.y = py;

                // Partículas del logo
                this.logoParticles.material.opacity = partA;
                this.logoParticles.material.size = 0.028 + energy * 0.012;
                this.logoParticles.visible = partA > 0.003;
                this.logoParticles.rotation.set(rx, ry, 0);
                this.logoParticles.position.y = py;
            }

            updateLogoParticles(dt) {
                // fuerza de atracción del puntero (solo en la fase de energía)
                const targetAtt = (this.phase === PHASE.ENERGY && (this.time - this.lastInteract) < 2.5)
                    ? 0.28 + (this.hold ? 0.4 : 0) : 0;
                this.attractS += (targetAtt - this.attractS) * (1 - Math.exp(-dt * 5));

                if (!this.logoParticles.visible) return;

                const attr = this.logoParticles.geometry.attributes.position;
                const arr = attr.array;
                const home = this.home, seed = this.seed, jit = this.jitter, xn = this.xn;
                const n = this.activeLogoCount;
                const t = this.time, ph = this.phase, prog = this.progress;
                const dir = this.dir, style = this.style, prev = this.prevStyle;
                const O = this.O, P = this.P;
                const morph = smooth(this.styleBlend);
                const morphing = this.styleBlend < 1;
                const att = this.attractS > 0.002 ? this.attractS : 0;
                const px = this.ptrWorld.x, py = this.ptrWorld.y, pz = this.ptrWorld.z;

                for (let i = 0; i < n; i++) {
                    const j = i * 3;
                    const s1 = seed[j], s2 = seed[j + 1], s3 = seed[j + 2];

                    formation(style, s1, s2, s3, t, dir, O);
                    let sx = O[0], sy = O[1], sz = O[2];
                    if (morphing) {
                        formation(prev, s1, s2, s3, t, dir, P);
                        sx = P[0] + (sx - P[0]) * morph;
                        sy = P[1] + (sy - P[1]) * morph;
                        sz = P[2] + (sz - P[2]) * morph;
                    }

                    let k;
                    if (ph === PHASE.DISSOLVE) {
                        k = smooth(prog * 1.5 - xn[i] * 0.5);        // ola de izquierda a derecha
                    } else if (ph === PHASE.REFORM) {
                        k = 1 - smooth(prog * 1.6 - s1 * 0.6);       // vuelven escalonadas
                    } else {
                        k = 1;
                    }

                    const hx = home[j], hy = home[j + 1], hz = home[j + 2];
                    const w = Math.sin(Math.PI * k); // curvatura de la trayectoria
                    let x = hx + (sx - hx) * k + jit[j] * w;
                    let y = hy + (sy - hy) * k + jit[j + 1] * w;
                    let z = hz + (sz - hz) * k + jit[j + 2] * w;

                    if (att > 0) {
                        const dx = px - x, dy = py - y, dz = pz - z;
                        const inf = Math.exp(-(dx * dx + dy * dy + dz * dz) * 0.1) * att;
                        x += dx * inf; y += dy * inf; z += dz * inf;
                    }

                    arr[j] = x; arr[j + 1] = y; arr[j + 2] = z;
                }

                this.logoParticles.geometry.setDrawRange(0, n);
                attr.needsUpdate = true;
            }

            updateAmbient(dt) {
                const boost = 1 + this.energy * 3;
                this.particles.rotation.y += 0.05 * dt * boost;
                this.particles.rotation.x += 0.02 * dt * boost;
            }

            updateLights() {
                const t = this.time;
                this.keyLight.position.x = 3 + Math.sin(t * 0.3) * 1.5;
                this.rimLight.intensity = 3.0 * (1 + this.energy * 0.5);
                this.bloomPass.strength = 0.55 + this.energy * 0.25 + this.flash * 0.6;
                this.bg.material.uniforms.uPulse.value = Math.min(1, this.flash + this.energy * 0.6);
                this.finishPass.uniforms.uTime.value = t % 100;
            }

            updateCamera(dt) {
                const t = this.time;
                const p = this.phaseT / DURATIONS[this.phase];
                const bz = this.baseZ;
                let tx = Math.sin(t * 0.15) * 0.35, ty = Math.sin(t * 0.11) * 0.12, tz = bz, ly = 0;

                switch (this.phase) {
                    case PHASE.DISSOLVE:
                        tz = bz * (1 - 0.07 * smooth(p));
                        break;
                    case PHASE.ENERGY: {
                        // Arco amplio que se abre y vuelve de frente al logo
                        const s = Math.sin(Math.PI * p);
                        const ang = this.dir * 0.62 * s;
                        const rad = bz * (1 + 0.95 * s);
                        tx = Math.sin(ang) * rad;
                        tz = Math.cos(ang) * rad;
                        ty = 0.25 + 1.9 * s;
                        ly = 0.5 * s;
                        break;
                    }
                    case PHASE.REFORM:
                        tz = bz * (1 - 0.07 * Math.sin(Math.PI * p));
                        break;
                    default:
                        break;
                }

                // Parallax suave con el puntero
                tx += this.ptrS.x * 0.45;
                ty += this.ptrS.y * 0.22;

                const f = 1 - Math.exp(-dt * 2.2);
                this.camPos.x += (tx - this.camPos.x) * f;
                this.camPos.y += (ty - this.camPos.y) * f;
                this.camPos.z += (tz - this.camPos.z) * f;
                this.lookY += (ly - this.lookY) * f;

                this.camera.position.copy(this.camPos);
                this.camera.lookAt(0, this.lookY, 0);
            }

            animate(now) {
                requestAnimationFrame(this.animate);

                const dt = Math.min(0.05, (now - this.last) / 1000);
                this.last = now;
                this.time += dt;

                this.updateTimeline(dt);
                this.updateCamera(dt);
                this.updatePointerWorld();
                this.updateLogoParticles(dt);
                this.updateAmbient(dt);
                this.updateSparks(dt);
                this.updateRings(dt);
                this.updateLights();
                this.monitorPerformance(dt);

                this.composer.render();
            }
        }

        new RamsonsInfinite();
    </script>
</body>
</html>
